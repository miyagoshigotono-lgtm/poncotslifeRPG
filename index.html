<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4e6c0">
<title>ポンコツライフRPG</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #fceeb5; 
    --line-color: #2b2b2b;
    --panel-bg: #ffffff;
    --window-bg: #1e3050; /* RPG風ウィンドウ背景 */
    --window-border: #f8f8f8;
    --btn-color1: #ff6b6b; 
    --btn-color2: #4ecdc4; 
    --highlight: #ffd166;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { 
    background: var(--bg-color); 
    background-image: radial-gradient(#d4c698 1px, transparent 1px);
    background-size: 20px 20px;
    font-family: 'DotGothic16', monospace; 
    color: var(--line-color); 
    height: 100dvh; overflow: hidden;
    display: flex; justify-content: center; align-items: flex-start;
  }
  
  #app {
    width: 100%; max-width: 420px; height: 100%;
    display: flex; flex-direction: column; gap: 12px;
    padding: 12px; overflow-y: auto; position: relative;
  }
  #app::-webkit-scrollbar { display: none; }

  /* プレミアムパネル */
  .panel {
    background: var(--panel-bg);
    border: 4px solid var(--line-color);
    border-radius: 12px;
    box-shadow: 4px 6px 0px rgba(43,43,43,0.3);
    padding: 12px; position: relative;
    transition: transform 0.2s;
  }

  /* ステータス (RPGウィンドウ風) */
  #status-area { 
    background: var(--window-bg); color: #fff;
    border: 4px solid var(--window-border);
    box-shadow: 0 0 0 4px var(--line-color), 4px 6px 0px rgba(43,43,43,0.3);
    border-radius: 8px;
  }
  .status-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 20px; text-shadow: 2px 2px 0 #000; }
  .exp-bar-wrap { width: 100%; height: 14px; border: 3px solid #000; background: #333; border-radius: 4px; overflow: hidden; margin-top: 4px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);}
  .exp-fill { height: 100%; background: linear-gradient(90deg, #ff9e00, #ffd166); width: 0%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  .exp-label { font-size: 12px; text-align: right; margin-top: 2px; color: #ddd; }

  /* キャラクター */
  .chara-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; border-bottom: 2px dashed #ccc; padding-bottom: 4px; }
  .chara-title { font-size: 16px; }
  .chara-subtitle { font-size: 12px; color: #666; background: #eee; padding: 2px 6px; border-radius: 4px; }
  
  #chara-view { 
    width: 100%; aspect-ratio: 1; 
    border: 4px solid var(--line-color); border-radius: 8px;
    background-color: #87CEEB; 
    background-image: url('bg_pop.png'); 
    background-size: cover; background-position: center;
    position: relative; overflow: hidden;
    box-shadow: inset 0px 0px 20px rgba(0,0,0,0.3);
  }
  
  

  #chara-img { 
    position: absolute; width: 40%; 
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    image-rendering: pixelated;
    /* mix-blend-modeはJSで背景透過処理を行うため削除 */
    filter: drop-shadow(2px 4px 0px rgba(0,0,0,0.4));
  }

  /* アニメーション */
  @keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scaleY(1); } 50% { transform: translate(-50%, -48%) scaleY(0.95); } }
  .anim-idle { animation: breathe 2s infinite ease-in-out; }
  .anim-walk { transition: left 0.3s linear, top 0.3s linear; }

  @keyframes anim-spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
  @keyframes anim-squat { 0%, 100% { transform: translate(-50%, -50%) scale(1, 1); } 50% { transform: translate(-50%, -40%) scale(1.1, 0.8); } }
  @keyframes anim-eat { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.3); } }
  .anim-spin { animation: anim-spin 0.5s linear 2 !important; }
  .anim-squat { animation: anim-squat 0.4s ease-in-out 3 !important; }
  .anim-eat { animation: anim-eat 0.3s ease-in-out 4 !important; }

  .falling-item { position: absolute; font-size: 32px; animation: dropItem 1.2s ease-in forwards; z-index: 10; pointer-events: none;}
  @keyframes dropItem { 0% { top: -20%; opacity: 1; transform: translateX(-50%) scale(1) rotate(0deg); } 80% { top: 40%; opacity: 1; transform: translateX(-50%) scale(1.5) rotate(180deg); } 100% { top: 40%; opacity: 0; transform: translateX(-50%) scale(0) rotate(360deg); } }

  /* ボタンエリア */
  #btn-area { display: flex; gap: 12px; }
  .btn { 
    flex: 1; background: var(--panel-bg); 
    border: 4px solid var(--line-color); border-radius: 12px;
    font-family: 'DotGothic16', monospace; font-size: 18px; font-weight: bold;
    padding: 14px 4px; cursor: pointer; text-align: center;
    box-shadow: 0px 6px 0px var(--line-color);
    transition: all 0.1s; position: relative;
  }
  .btn:active { transform: translateY(6px); box-shadow: 0px 0px 0px var(--line-color); }
  .btn-food { background: linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%); color: #333; }
  .btn-ex { background: linear-gradient(180deg, #a1c4fd 0%, #c2e9fb 100%); color: #333; }

  /* 今日の記録 */
  .log-title { font-weight: bold; font-size: 16px; border-bottom: 2px solid var(--line-color); padding-bottom: 4px; margin-bottom: 8px; display: flex; justify-content: space-between;}
  .log-row { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; padding: 4px; background: #f9f9f9; border-radius: 4px; border-left: 4px solid var(--line-color); }

  /* モーダル */
  .modal-overlay { 
    position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(2px);
    display: none; justify-content: center; align-items: flex-end; z-index: 100;
  }
  .modal-overlay.open { display: flex; animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  
  .modal {
    width: 100%; max-width: 420px; max-height: 85vh;
    border-radius: 20px 20px 0 0; padding: 20px;
    display: flex; flex-direction: column;
  }
  .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 12px; text-align: center; }
  .modal-content { flex: 1; overflow-y: auto; margin-bottom: 12px; padding: 4px; }
  .modal-actions { display: flex; gap: 12px; }
  
  input[type="number"], input[type="text"] { 
    width: 100%; background: #f0f0f0; border: 4px solid var(--line-color); border-radius: 8px;
    color: var(--line-color); font-family: 'DotGothic16', monospace; font-size: 20px;
    padding: 12px; outline: none; margin-bottom: 12px; font-weight: bold;
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
  }
  .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  
  /* 運動検索リスト */
  .ex-search-box { position: sticky; top: 0; background: var(--panel-bg); padding-bottom: 8px; }
  .ex-category { font-size: 12px; color: #888; margin: 8px 0 4px; font-weight: bold; }
  .ex-item { 
    border: 3px solid #ccc; border-radius: 8px; padding: 10px; margin-bottom: 8px; 
    cursor: pointer; display: flex; justify-content: space-between; font-weight: bold;
    transition: all 0.1s; background: #fafafa;
  }
  .ex-item:hover { border-color: var(--line-color); transform: scale(1.02); }
  .ex-item.selected { background: var(--highlight); border-color: var(--line-color); color: #000; box-shadow: 2px 2px 0 #000;}

  #toast { 
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(30,30,30,0.9); color: #fff; padding: 12px 24px; 
    border-radius: 30px; text-align: center; display: none; font-weight: bold; z-index: 200;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 18px;
  }

  /* 瀕死・死亡オーバーレイ */
  #death-overlay {
    position: absolute; inset: 0; background: rgba(200,0,0,0.85);
    display: none; flex-direction: column; justify-content: center; align-items: center;
    color: #fff; z-index: 50; text-align: center; padding: 20px;
  }
  #death-icon { font-size: 70px; margin-bottom: 10px; animation: heartbeat 1s infinite; }
  #death-title { font-size: 28px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #000; margin-bottom: 10px; }
  #death-desc { font-size: 16px; margin-bottom: 20px; line-height: 1.5; text-shadow: 1px 1px 0 #000; }
  @keyframes heartbeat { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

  #bonus-effect {
    position: absolute; inset: 0; pointer-events: none;
    display: none; justify-content: center; align-items: center; z-index: 90;
  }
  .sparkle { font-size: 50px; position: absolute; animation: floatUp 1.5s ease-out forwards; filter: drop-shadow(0 0 10px gold); }
</style>
</head>
<body>
<div id="app">
  
  <div class="panel" id="status-area">

<script>
// --- サウンドマネージャー (レトロなシンセ音生成) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  const now = audioCtx.currentTime;
  if(type === 'click') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
    osc.start(now); osc.stop(now + 0.05);
  } else if(type === 'coin') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(987.77, now); // B5
    osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.4);
    osc.start(now); osc.stop(now + 0.4);
  } else if(type === 'damage') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if(type === 'fanfare') {
    osc.type = 'square';
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => { // C E G C
      setTimeout(() => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'square'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        o.start(); o.stop(audioCtx.currentTime + 0.2);
      }, i * 150);
    });
  }
}

document.addEventListener('click', () => initAudio(), {once: true});

// --- ゲーム定数 ---
const INITIAL_BALANCE = 3000;
const DAILY_GRANT = 2500;
const INACTIVE_PENALTY = 100;
const FOOD_MIN_YEN = 300;
const EX_MAX_MINS = 240;
const STARVATION_WARNING_HOURS = 24; // 24時間で瀕死
const STARVATION_DEATH_HOURS = 48;   // 48時間で完全死

// キャラクターバリエーション (10種類) 色相と名前の定義
const CHARA_TYPES = [
  {id: 0, name: 'スライムもどき', hue: 0},
  {id: 1, name: 'ベスもどき', hue: 320}, // 赤・オレンジ系
  {id: 2, name: 'ポイズンもどき', hue: 280}, // 紫系
  {id: 3, name: 'レモンもどき', hue: 60}, // 黄色系
  {id: 4, name: 'アクアもどき', hue: 200}, // 水色系
  {id: 5, name: 'ダークもどき', hue: 180, invert: true}, // 反転色
  {id: 6, name: 'メタルもどき', hue: 0, gray: true}, // グレー
  {id: 7, name: 'ピーチもどき', hue: 300}, // ピンク系
  {id: 8, name: 'エメラルドもどき', hue: 120}, // 緑系
  {id: 9, name: 'ゴールドもどき', hue: 45, contrast: 2} // 金色っぽく
];

const STAGES = [
  { level:0,  name:'失踪',           min:-Infinity, max:-Infinity },
  { level:1,  name:'引っ越しの準備', min:-Infinity, max:-Infinity },
  { level:2,  name:'ホームレスの生活',min:-Infinity, max:-Infinity },
  { level:3,  name:'差し押さえの生活',min:-Infinity, max:-Infinity },
  { level:4,  name:'火の車な生活',   min:-Infinity, max:-Infinity },
  { level:5,  name:'苦しい生活',     min:-Infinity, max:-Infinity },
  { level:6,  name:'カツカツの生活', min:0,     max:3500 },
  { level:7,  name:'普通の生活',     min:3500,  max:5000 },
  { level:8,  name:'余裕のある生活', min:5000,  max:7000 },
  { level:9,  name:'裕福な生活',     min:7000,  max:10000 },
  { level:10, name:'大富豪',         min:10000, max:Infinity },
];

// 大規模データベース（ダミーも含む）
const EXERCISE_DB = [
  { id:1, name:'ウォーキング (普通)', rate:3.3 }, 
  { id:2, name:'ウォーキング (早歩き)', rate:4.7 }, 
  { id:3, name:'ジョギング', rate:6.3 },
  { id:4, name:'ランニング (速い)', rate:9.0 },
  { id:5, name:'筋トレ (自重/軽め)', rate:3.5 }, 
  { id:6, name:'筋トレ (ウェイト/激しい)', rate:6.0 }, 
  { id:7, name:'自転車 (通勤・通学)', rate:4.3 },
  { id:8, name:'自転車 (ロードバイク)', rate:8.0 },
  { id:9, name:'水泳 (平泳ぎ)', rate:5.3 }, 
  { id:10, name:'水泳 (クロール)', rate:8.3 }, 
  { id:11, name:'縄跳び', rate:6.7 },
  { id:12, name:'ヨガ・ストレッチ', rate:2.5 }, 
  { id:13, name:'階段昇降', rate:4.0 },
  { id:14, name:'スケートボード', rate:5.0 },
  { id:15, name:'テニス', rate:6.0 },
  { id:16, name:'サッカー/フットサル', rate:7.0 },
  { id:17, name:'バスケットボール', rate:6.5 },
  { id:18, name:'家事 (掃除機・モップ)', rate:2.5 },
  { id:19, name:'散歩 (犬の散歩)', rate:3.0 },
  { id:20, name:'ダンス (エアロビクス)', rate:5.5 }
];

let state = loadState();
function defaultState() {
  const newCharaId = Math.floor(Math.random() * 10);
  return {
    charaId: newCharaId,
    balance: INITIAL_BALANCE,
    stage: 6,
    deficitDays: 0,
    lastDate: today(),
    lastMealTime: Date.now(),
    logs: [],
    todayExercised: false,
    todayExerciseMins: 0,
    recentExercises: [], // [id1, id2...]
    version: 7,
    stageFoodTotal: 0,
    stageExTotal: 0,
    stageDays: 0,
    patternName: '判定中...',
    loginStreak: 0
  };
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('mncState7') || 'null');
    return (s && s.version) ? s : defaultState();
  } catch { return defaultState(); }
}
function saveState() { localStorage.setItem('mncState7', JSON.stringify(state)); }
function today() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

// --- 画像の白背景透過＆色相変更処理 (キャンバス) ---
async function processCharacterImage() {
  const cType = CHARA_TYPES[state.charaId || 0];
  document.getElementById('ui-chara-name').innerText = cType.name;
  const targetImg = document.getElementById('chara-img');

  let filterStr = `hue-rotate(${cType.hue}deg)`;
  if(cType.invert) filterStr += ' invert(100%)';
  if(cType.gray) filterStr += ' grayscale(100%)';
  if(cType.contrast) filterStr += ` contrast(${cType.contrast})`;

  try {
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.src = "chara_pop.png"; 
    
    await new Promise((resolve, reject) => { 
      img.onload = resolve; 
      img.onerror = () => reject(new Error('CORS Error')); 
    });
    if(img.width === 0) throw new Error('Empty Image');

    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    ctx.filter = filterStr;
    ctx.drawImage(img, 0, 0);
    
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i] > 240 && data[i+1] > 240 && data[i+2] > 240) data[i+3] = 0;
    }
    ctx.putImageData(imgData, 0, 0);
    targetImg.src = canvas.toDataURL();

  } catch (e) {
    // ローカル(file://)のセキュリティ制限時は、CSSフィルターでフォールバック表示
    targetImg.style.filter = filterStr + ' drop-shadow(2px 4px 0px rgba(0,0,0,0.4))';
    targetImg.style.mixBlendMode = 'multiply';
    targetImg.src = "chara_pop.png";
  }
}

let todayEventMsg = "";

function init() {
  processCharacterImage();
  checkDaily();
  calcPattern();
  render();
  startWandering();
  
  if(todayEventMsg) {
    setTimeout(() => { alert("📜 本日の出来事\n\n" + todayEventMsg); }, 600);
  }
}

function checkDaily() {
  const t = today();
  if (state.lastDate !== t) {
    state.balance += DAILY_GRANT;
    
    // 連続運動判定
    if (state.todayExercised) {
      state.loginStreak = (state.loginStreak || 0) + 1;
    } else if (state.lastDate !== t) {
      state.loginStreak = 0; // サボったらリセット
      state.balance -= INACTIVE_PENALTY;
    }
    
    // ランダムイベント (20%の確率で発生)
    if(Math.random() < 0.2) {
      const events = [
        { msg: "村人からおだちんをもらった！ (+300円)", val: 300 },
        { msg: "寝ている間に魔物に襲撃された！ (-200円)", val: -200 },
        { msg: "道に小銭が落ちていた！ (+100円)", val: 100 }
      ];
      const ev = events[Math.floor(Math.random()*events.length)];
      state.balance += ev.val;
      todayEventMsg = ev.msg;
    } else {
      todayEventMsg = `おはよう！\n本日の支給額 ${DAILY_GRANT}円 を受け取った！\n今日も1日頑張るのじゃ！`;
    }
    
    if (state.balance < 0) {
      state.deficitDays++;
      if (state.deficitDays >= 12) return triggerDeath('失踪（赤字12日）', true);
    } else {
      state.deficitDays = 0;
    }
    
    state.todayExercised = false;
    state.todayExerciseMins = 0;
    state.logs = []; 
    state.lastDate = t;
    state.stageDays++; 
    
    updateStage();
    calcPattern();
    saveState();
  }
}

function updateStage() {
  const oldStage = state.stage;
  if (state.balance < 0) {
    if (state.deficitDays >= 10) state.stage = 1;
    else if (state.deficitDays >= 8) state.stage = 2;
    else if (state.deficitDays >= 6) state.stage = 3;
    else if (state.deficitDays >= 4) state.stage = 4;
    else if (state.deficitDays >= 2) state.stage = 5;
    else state.stage = 6;
  } else {
    for (let i = 10; i >= 6; i--) {
      if (state.balance >= STAGES[i].min) { state.stage = i; break; }
    }
  }
  
  if(oldStage !== state.stage && state.stage >= 6) {
    state.stageFoodTotal = 0; state.stageExTotal = 0; state.stageDays = 1;
    state.patternName = '判定中...';
  }
}

function calcPattern() {
  if (state.stage < 6 || state.stageDays < 1) return;
  const avgFood = state.stageFoodTotal / state.stageDays;
  const avgEx = state.stageExTotal / state.stageDays;
  if (avgFood <= 800 && avgEx >= 30) state.patternName = '超健康・節約家';
  else if (avgFood <= 800 && avgEx < 30) state.patternName = 'インドア節約家';
  else if (avgFood > 800 && avgEx >= 30) state.patternName = 'アクティブ豪遊';
  else state.patternName = 'インドア浪費家';
}

function render() {
  document.getElementById('ui-balance').innerText = state.balance.toLocaleString() + '円';
  document.getElementById('ui-streak').innerText = `🔥 連続運動: ${state.loginStreak || 0}日`;
  const stageData = STAGES[state.stage] || STAGES[6];
  document.getElementById('ui-stage-name').innerText = stageData.name;
  
  // 背景切り替え
  const view = document.getElementById('chara-view');
  if (state.stage >= 9) view.style.backgroundImage = "url('bg_rich.png')";
  else if (state.stage >= 7) view.style.backgroundImage = "url('bg_normal.png')";
  else view.style.backgroundImage = "url('bg_pop.png')";

  
  if (state.balance < 0) {
    document.getElementById('ui-pattern-name').innerText = `☠️ 赤字 ${state.deficitDays}日目`;
    document.getElementById('ui-exp-fill').style.width = '0%';
    document.getElementById('ui-exp-label').innerText = '借金返済まで...';
  } else {
    document.getElementById('ui-pattern-name').innerText = `✨ ${state.patternName}`;
    const nextStage = STAGES[state.stage + 1];
    if (nextStage && nextStage.min !== Infinity) {
      const min = stageData.min === -Infinity ? 0 : stageData.min;
      const range = nextStage.min - min;
      const progress = state.balance - min;
      const percent = Math.min(100, Math.max(0, (progress / range) * 100));
      document.getElementById('ui-exp-fill').style.width = percent + '%';
      document.getElementById('ui-exp-label').innerText = `次まで ${nextStage.min - state.balance}円`;
    } else {
      document.getElementById('ui-exp-fill').style.width = '100%';
      document.getElementById('ui-exp-label').innerText = 'MAX';
    }
  }

  const logHtml = state.logs.map(l => `<div class="log-row"><span><small style="color:#888;margin-right:6px;font-size:12px;">${l.time||''}</small>${l.label}</span><span style="color:${l.val>0?'#27ae60':'#c0392b'}; font-weight:bold;">${l.val > 0 ? '+'+l.val : l.val}円</span></div>`).join('');
  document.getElementById('log-list').innerHTML = logHtml || '<div style="text-align:center; padding-top:4px; color:#888;">まだ記録がないぞい</div>';
  
  checkDeath();
}

function checkDeath() {
  if (!state.lastMealTime) return;
  const elapsedHours = (Date.now() - state.lastMealTime) / (1000 * 3600);
  
  if (elapsedHours >= STARVATION_DEATH_HOURS) {
    triggerDeath('餓死（48時間経過）', true);
  } else if (elapsedHours >= STARVATION_WARNING_HOURS) {
    triggerDeath('餓死寸前', false);
    const remain = Math.max(0, Math.floor(STARVATION_DEATH_HOURS - elapsedHours));
    document.getElementById('death-timer').innerText = remain;
  } else {
    document.getElementById('death-overlay').style.display = 'none';
  }
}

function triggerDeath(reason, isFinal) {
  const overlay = document.getElementById('death-overlay');
  overlay.style.display = 'flex';
  
  if (isFinal) {
    playSound('damage');
    document.getElementById('death-title').innerText = 'ゲームオーバー';
    document.getElementById('death-desc').innerHTML = `${reason}により<br>キャラクターは息絶えた...`;
    document.getElementById('btn-rescue').style.display = 'none';
    document.getElementById('btn-restart').style.display = 'block';
  } else {
    document.getElementById('death-title').innerText = '⚠️ 餓死寸前 ⚠️';
    document.getElementById('btn-rescue').style.display = 'block';
    document.getElementById('btn-restart').style.display = 'none';
  }
}

function resetGame() {
  state = defaultState();
  saveState();
  location.reload();
}

function rescueFood() { openFood(); }

// --- モーダル・UI操作 ---
function openFood() { 
  initAudio(); playSound('click');
  document.getElementById('input-food').value = '';
  document.getElementById('modal-food').classList.add('open'); 
}

function openExercise() { 
  initAudio(); playSound('click');
  document.getElementById('input-ex').value = '';
  document.getElementById('search-ex').value = '';
  renderExerciseList('');
  document.getElementById('modal-ex').classList.add('open'); 
}

function closeModal(id) { playSound('click'); document.getElementById(id).classList.remove('open'); }
function closeModalBg(e, id) { if(e.target.id === id) closeModal(id); }

// 運動検索・履歴リスト描画
function renderExerciseList(query) {
  const q = query.toLowerCase();
  
  // 履歴の表示 (検索クエリがない時のみ)
  const recentDiv = document.getElementById('ex-recent-list');
  if(q === '' && state.recentExercises.length > 0) {
    const recentItems = state.recentExercises.map(id => EXERCISE_DB.find(e => e.id === id)).filter(Boolean);
    recentDiv.innerHTML = `<div class="ex-category">⭐ 最近の履歴</div>` + recentItems.map(ex => 
      `<div class="ex-item" id="ex-${ex.id}" onclick="selEx(${ex.id})"><span>${ex.name}</span><span>${ex.rate}円/分</span></div>`
    ).join('');
  } else {
    recentDiv.innerHTML = '';
  }

  // 全体検索リスト
  const filtered = EXERCISE_DB.filter(ex => ex.name.toLowerCase().includes(q));
  document.getElementById('ex-list').innerHTML = `<div class="ex-category">🔍 検索結果</div>` + filtered.map(ex => 
    `<div class="ex-item" id="ex-${ex.id}" onclick="selEx(${ex.id})"><span>${ex.name}</span><span>${ex.rate}円/分</span></div>`
  ).join('');
}

function filterExercises() {
  const q = document.getElementById('search-ex').value;
  renderExerciseList(q);
}

let currentEx = null;
function selEx(id) {
  playSound('click');
  currentEx = EXERCISE_DB.find(e => e.id === id);
  document.querySelectorAll('.ex-item').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll(`#ex-${id}`).forEach(el => el.classList.add('selected'));
}

function setFood(v) { playSound('click'); document.getElementById('input-food').value = v; }

function submitFood() {
  const v = parseInt(document.getElementById('input-food').value);
  if(!v) return;
  if(v < FOOD_MIN_YEN) {
    playSound('damage');
    alert(`ズルはだめじゃ！自炊や軽食でも最低 ${FOOD_MIN_YEN}円 換算じゃぞ！`);
    return;
  }
  
  state.balance -= v;
  state.lastMealTime = Date.now();
  state.stageFoodTotal += v;
  
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  state.logs.unshift({ label: '🍖 食事', val: -v, time: timeStr });
  if(state.logs.length > 5) state.logs.pop();
  
  if(v >= 2000) { showGouyuuBonus(); } else { playSound('coin'); showToast(`-${v}円`); }
  
  finishAction('modal-food', 'food');
}

function submitExercise() {
  if(!currentEx) return;
  const v = parseInt(document.getElementById('input-ex').value);
  if(!v) return;
  if (state.todayExerciseMins + v > EX_MAX_MINS) {
    playSound('damage');
    alert(`働きすぎじゃ！1日の運動上限は合計 ${EX_MAX_MINS} 分までじゃぞ！\n（本日は既に ${state.todayExerciseMins}分 記録済み）`);
    return;
  }
  
  // 履歴更新 (重複削除して先頭に追加、最大5件)
  state.recentExercises = [currentEx.id, ...state.recentExercises.filter(id => id !== currentEx.id)].slice(0, 5);
  
  let earn = Math.floor(currentEx.rate * v);
  let bonusStr = "";
  if((state.loginStreak || 0) >= 3) {
    earn = Math.floor(earn * 1.2);
    bonusStr = " (🔥ボーナス)";
  }
  
  state.balance += earn;
  state.todayExercised = true;
  state.todayExerciseMins += v;
  state.stageExTotal += v;
  
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  state.logs.unshift({ label: `⚔️ ${currentEx.name}${bonusStr}`, val: earn, time: timeStr });
  if(state.logs.length > 5) state.logs.pop();
  
  playSound('coin');
  showToast(`+${earn}円`);
  finishAction('modal-ex', 'ex');
}

function finishAction(modalId, actionType) {
  updateStage();
  calcPattern();
  saveState();
  closeModal(modalId);
  render();
  playActionAnimation(actionType);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display='none', 2000);
}

function showGouyuuBonus() {
  playSound('fanfare');
  showToast('✨豪遊ボーナス！心は満たされた！✨');
  const effect = document.getElementById('bonus-effect');
  effect.style.display = 'flex';
  effect.innerHTML = '🍖✨💎'.split('').map((e,i) => `<div class="sparkle" style="left:${30+i*20}%; animation-delay:${i*0.2}s">${e}</div>`).join('');
  setTimeout(() => { effect.style.display = 'none'; effect.innerHTML = ''; }, 2000);
}

// --- キャラクターアニメーション ---
let cX = 50, cY = 50; 
let tX = 50, tY = 50; 
let scaleX = 1;
let isActionPlaying = false;

function startWandering() {
  const chara = document.getElementById('chara-img');
  setInterval(() => {
    if(Math.random() < 0.6 && !isActionPlaying) {
      tX = Math.random() * 60 + 20; 
      tY = Math.random() * 60 + 20; 
    }
  }, 2500);

  function animate() {
    if(!isActionPlaying) {
      let dx = tX - cX;
      let dy = tY - cY;
      
      if(Math.abs(dx) > 0.5) {
        cX += dx * 0.03;
        scaleX = dx > 0 ? -1 : 1; 
        chara.classList.remove('anim-idle');
      } else {
        chara.classList.add('anim-idle');
      }
      if(Math.abs(dy) > 0.5) cY += dy * 0.03;

      chara.style.left = cX + '%';
      chara.style.top = cY + '%';
      chara.style.transform = `translate(-50%, -50%) scaleX(${scaleX})`;
    }
    requestAnimationFrame(animate);
  }
  animate();
}

function playActionAnimation(type) {
  isActionPlaying = true;
  const chara = document.getElementById('chara-img');
  const view = document.getElementById('chara-view');
  
  chara.classList.remove('anim-idle', 'anim-walk');
  
  const actionsFood = ['anim-eat'];
  const actionsEx = ['anim-spin', 'anim-squat'];
  const itemsFood = ['🍖','🍎','🍔','🍰','🍙'];
  const itemsEx = ['💪','🏋️','🏃','🔥','💦'];
  
  let animClass, emoji;
  if(type === 'food') {
    animClass = actionsFood[Math.floor(Math.random()*actionsFood.length)];
    emoji = itemsFood[Math.floor(Math.random()*itemsFood.length)];
  } else {
    animClass = actionsEx[Math.floor(Math.random()*actionsEx.length)];
    emoji = itemsEx[Math.floor(Math.random()*itemsEx.length)];
  }
  
  const item = document.createElement('div');
  item.className = 'falling-item';
  item.innerText = emoji;
  item.style.left = cX + '%';
  view.appendChild(item);
  
  chara.classList.add(animClass);
  
  setTimeout(() => {
    chara.classList.remove(animClass);
    if(item.parentNode) item.parentNode.removeChild(item);
    isActionPlaying = false;
  }, 1200);
}

init();
setInterval(checkDeath, 60000);
</script>
